<title>Header klientského newsletteru</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=Lora:wght@400;500&display=swap">

<style>
:root{
  --canvas:#D7D4CE;
  --edge:rgba(0,0,0,.12);

  --ev-orange:#E5712C;
  --ev-orange-solid:#ED692C;
  --ev-dark:#202020;
  --ev-cream:#FDF8F2;
  --ev-ink:#1A1A1A;
  --ev-ink-soft:#4A4A48;
  --ev-grad:linear-gradient(90deg,#FAB418 0%,#ED692C 33%,#E9C623 66%,#BDD46B 100%);

  --f-ev:'Inter Tight','Helvetica Neue',Helvetica,Arial,sans-serif;
  --f-ev-serif:'Lora',Georgia,'Times New Roman',serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--canvas:#121211;--edge:rgba(255,255,255,.14)}
}
:root[data-theme="dark"]{--canvas:#121211;--edge:rgba(255,255,255,.14)}

*{box-sizing:border-box}
body{
  margin:0;background:var(--canvas);font-family:var(--f-ev);
  -webkit-font-smoothing:antialiased;
  min-height:100vh;display:flex;align-items:center;justify-content:center;padding:48px 24px;
}

.h{
  width:600px;max-width:100%;text-align:left;
  box-shadow:0 1px 2px var(--edge),0 16px 40px -12px rgba(0,0,0,.32);
}

.h-bar{height:72px;padding:0 24px;display:flex;align-items:center;justify-content:space-between;gap:16px;background:var(--ev-dark)}
.h-logo{--logo-ink:#FFFFFF;--logo-cut:#FFFFFF;display:block;flex:0 0 auto}
.h-logo svg{width:125px;height:24px;display:block}
.h-svc{font-weight:600;font-size:10px;line-height:12px;letter-spacing:.20em;text-transform:uppercase;color:rgba(255,255,255,.45);white-space:nowrap}

.h-rule{height:4px;background-color:var(--ev-orange-solid);background-image:var(--ev-grad)}

.h-hero{padding:44px 32px 40px;background:var(--ev-cream)}
.h-eyebrow{margin:0 0 14px;font-weight:600;font-size:11px;line-height:14px;letter-spacing:.22em;text-transform:uppercase;color:var(--ev-orange)}
.h-title{margin:0 0 16px;font-weight:700;font-size:34px;line-height:1.08;letter-spacing:-.03em;color:var(--ev-ink)}
.h-title .d{color:var(--ev-orange)}
.h-lead{margin:0 0 26px;font-family:var(--f-ev-serif);font-weight:400;font-size:18px;line-height:1.55;color:var(--ev-ink-soft);max-width:480px}
.h-cta{
  display:inline-block;background:var(--ev-orange);color:#FFF;text-decoration:none;
  font-weight:600;font-size:15px;line-height:16px;letter-spacing:.01em;padding:15px 28px;border-radius:4px;
}
.h-cta:focus-visible{outline:2px solid var(--ev-dark);outline-offset:3px}

@media (max-width:640px){
  body{padding:20px 12px;align-items:flex-start}
  .h-bar{height:64px;padding:0 18px}
  .h-svc{display:none}
  .h-hero{padding:32px 22px 30px}
  .h-title{font-size:26px;letter-spacing:-.02em}
  .h-lead{font-size:17px;margin-bottom:24px}
  .h-cta{display:block;text-align:center;padding:16px 20px}
}
</style>
